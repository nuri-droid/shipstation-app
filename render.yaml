services:
  - type: web
    name: shipstation-inventory
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 600 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MOCK_MODE
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: APP_USERS
        sync: false
      - key: SS_V1_KEY
        sync: false
      - key: SS_V1_SECRET
        sync: false
      - key: SS_V2_KEY
        sync: false
      - key: FEDEX_CLIENT_ID
        sync: false
      - key: FEDEX_CLIENT_SECRET
        sync: false
      - key: FEDEX_ACCOUNT
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
